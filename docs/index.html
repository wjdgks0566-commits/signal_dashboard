<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#03C75A">
    <title>HOZISTOCK</title>
    <style>
        :root {
            --bg: #f6f9fc;
            --card: #ffffff;
            --border: #e3e8ee;
            --border-hover: #cbd5e1;
            --text: #0a2540;
            --text-dim: #425466;
            --text-muted: #8898aa;
            --buy: #00d97e;
            --buy-light: #e6faf3;
            --up: #ef4444;
            --up-light: #fef2f2;
            --down: #3b82f6;
            --down-light: #eff6ff;
            --accent: #635bff;
            --accent-light: #f0efff;
            --dot-strong: #991b1b;
            --dot-medium: #dc2626;
            --dot-light: #fca5a5;
            --spike: #dc2626;
            --star: #fbbf24;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg: #0a0e17;
            --card: #151a24;
            --border: #252b38;
            --border-hover: #3a4152;
            --text: #f7fafc;
            --text-dim: #cbd5e1;
            --text-muted: #64748b;
            --buy-light: rgba(0,217,126,0.15);
            --up-light: rgba(239,68,68,0.15);
            --down-light: rgba(59,130,246,0.15);
            --accent-light: rgba(99,91,255,0.2);
            --dot-strong: #fca5a5;
            --dot-medium: #ef4444;
            --dot-light: #7f1d1d;
            --spike: #ef4444;
            --star: #fcd34d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px 20px;
            max-width: 1200px;
            margin: 0 auto;
            line-height: 1.5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        h1 { 
            font-size: 24px; 
            font-weight: 800; 
            letter-spacing: 0.05em;
            color: #03C75A;
        }
        .header-right { display: flex; align-items: center; gap: 14px; }
        .header-date { 
            font-size: 13px; 
            color: var(--text-muted); 
            font-weight: 500; 
            text-align: right;
        }
        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
        }
        .stat-label { 
            font-size: 12px; 
            color: var(--text-muted); 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .stat-value { font-size: 26px; font-weight: 700; }
        .stat-value.buy { color: var(--buy); }
        .stat-value.up { color: var(--up); }
        .stat-value.down { color: var(--down); }
        .stat-value.volume { color: var(--spike); }
        .sector-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .sector-tab {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .sector-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
        .sector-count {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 6px;
            background: var(--accent-light);
            color: var(--accent);
        }
        .sector-tab.active .sector-count { background: rgba(255,255,255,0.25); color: white; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 28px; }
        .search-input {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin: 32px 0 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 14px;
        }
        .section-icon.buy { background: var(--buy-light); color: var(--buy); }
        .section-icon.hold { background: var(--accent-light); color: var(--accent); }
        .section-icon.error { background: var(--up-light); color: var(--up); }
        .section-count { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-left: 4px; }
        .buy-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .buy-card-header {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .buy-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
        .stock-meta { min-width: 0; }
        .stock-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stars {
            color: var(--star);
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .stock-name { font-size: 16px; font-weight: 600; color: var(--text); }
        .stock-tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
        .sector-tag {
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }
        .signal-source-tag {
            background: var(--buy);
            color: white;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .signal-source-tag.premium {
            background: var(--star);
            color: #78350f;
        }
        .spike-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--spike);
            color: white;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .spike-tag::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
        }
        .volume-dot {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
        }
        .volume-dot::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dot-light);
        }
        .volume-dot.medium::before { background: var(--dot-medium); }
        .volume-dot.strong::before { background: var(--dot-strong); }
        .buy-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
        .price-block { text-align: right; }
        .price { font-size: 17px; font-weight: 700; color: var(--text); }
        .change { font-size: 13px; font-weight: 600; margin-top: 2px; }
        .change.up { color: var(--up); }
        .change.down { color: var(--down); }
        .change.flat { color: var(--text-muted); }
        .expand-icon { color: var(--text-muted); font-size: 14px; transition: transform 0.2s; }
        .buy-card.expanded .expand-icon { transform: rotate(180deg); }
        .buy-detail {
            display: none;
            padding: 4px 20px 20px;
            border-top: 1px solid var(--border);
        }
        .buy-card.expanded .buy-detail { display: block; }
        .detail-code {
            font-size: 12px;
            color: var(--text-muted);
            margin: 12px 0;
            font-family: 'SF Mono', Consolas, monospace;
        }
        .signal-source-box {
            background: var(--buy-light);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px 0;
            font-size: 14px;
            color: var(--text);
        }
        .signal-source-box strong { color: var(--buy); margin-right: 6px; }
        .strategy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .strategy-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
        }
        .strategy-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .strategy-signal {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
        }
        .strategy-signal.buy { background: var(--buy); color: white; }
        .strategy-signal.hold { background: var(--border); color: var(--text-muted); }
        .strategy-signal.spike { background: var(--spike); color: white; }
        .strategy-detail { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
        .strategy-detail div { margin: 3px 0; }
        .yes { color: var(--buy); font-weight: 600; }
        .no { color: var(--text-muted); }
        .hold-table-wrapper {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .hold-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .hold-table thead {
            background: var(--bg);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .hold-table th {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }
        .hold-table th:hover { color: var(--accent); }
        .hold-table th.sort-active { color: var(--accent); }
        .hold-table th .sort-icon {
            display: inline-block;
            margin-left: 4px;
            font-size: 10px;
            opacity: 0.4;
        }
        .hold-table th.sort-active .sort-icon { opacity: 1; }
        .hold-table th.text-left, .hold-table td.text-left { text-align: left; }
        .hold-table th.text-right, .hold-table td.text-right { text-align: right; }
        .hold-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .hold-table tbody tr:hover { background: var(--bg); }
        .hold-table tbody tr:last-child td { border-bottom: none; }
        .table-stock-name { font-weight: 600; }
        .table-price { font-weight: 600; font-variant-numeric: tabular-nums; }
        td .volume-dot { justify-content: flex-end; }
        .error-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .error-reason { color: var(--up); font-size: 13px; font-weight: 500; }
        .footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        @media (max-width: 768px) {
            body { padding: 16px 12px; }
            h1 { font-size: 20px; }
            .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-card { padding: 12px 14px; }
            .stat-value { font-size: 20px; }
            .hold-table { font-size: 13px; }
            .hold-table th, .hold-table td { padding: 10px 8px; }
            .col-sector { display: none; }
            .buy-card-header { padding: 14px 16px; flex-wrap: wrap; }
            .strategy-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

            const spikeTag = renderSpikeTag(s.volume_ratio);
            const starsHtml = renderStars(s.star_grade);
            
            return '<div class="buy-card" onclick="toggleExpand(this)"><div class="buy-card-header"><div class="buy-left"><div class="stock-meta"><div class="stock-name-row">' + starsHtml + '<div class="stock-name">' + s.name + '</div></div><div class="stock-tags"><span class="sector-tag">' + (s.sector || '기타') + '</span>' + sourceTags + spikeTag + '</div></div></div><div class="buy-right"><div class="price-block"><div class="price">' + priceStr + '원</div>' + formatChange(s.change_pct) + '</div><span class="expand-icon">▼</span></div></div><div class="buy-detail" onclick="event.stopPropagation()"><div class="detail-code">종목코드: ' + s.code + '</div><div class="signal-source-box"><strong>매수 신호:</strong>' + (s.signal_source || 'N/A') + '</div><div class="strategy-grid">' + strategyDetails + '</div></div></div>';
        }
        
        function getSortIcon(field) {
            if (sortField !== field) return '<span class="sort-icon">↕</span>';
            return '<span class="sort-icon">' + (sortDesc ? '↓' : '↑') + '</span>';
        }
        
        function getSortClass(field) {
            return sortField === field ? 'sort-active' : '';
        }
        
        function renderHoldTable(list) {
            let html = '<div class="hold-table-wrapper"><table class="hold-table"><thead><tr>';
            html += '<th class="text-left ' + getSortClass('name') + '" onclick="sortBy(\'name\')">종목명' + getSortIcon('name') + '</th>';
            html += '<th class="text-left col-sector">섹터</th>';
            html += '<th class="text-right ' + getSortClass('price') + '" onclick="sortBy(\'price\')">현재가' + getSortIcon('price') + '</th>';
            html += '<th class="text-right ' + getSortClass('change') + '" onclick="sortBy(\'change\')">등락률' + getSortIcon('change') + '</th>';
            html += '<th class="text-right">거래량</th>';
            html += '</tr></thead><tbody>';
            for (const s of list) {
                html += '<tr>';
                html += '<td class="text-left table-stock-name">' + s.name + '</td>';
                html += '<td class="text-left col-sector"><span class="sector-tag">' + (s.sector || '기타') + '</span></td>';
                html += '<td class="text-right table-price">' + s.current_price.toLocaleString() + '원</td>';
                html += '<td class="text-right">' + formatChangeInline(s.change_pct) + '</td>';
                html += '<td class="text-right">' + renderVolumeDot(s.volume_ratio) + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            return html;
        }
        
        function renderErrorItem(s) {
            return '<div class="error-item"><span class="table-stock-name">' + s.name + '</span><span class="error-reason">' + (s.reason || '') + '</span></div>';
        }
        
        function toggleExpand(card) {
            card.classList.toggle('expanded');
        }
        
        renderSectorTabs();
        applyFilter();
    </script>
</body>
</html>
