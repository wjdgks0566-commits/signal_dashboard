name: HOZISTOCK 대시보드 자동 생성

on:
  schedule:
    - cron: '30 23 * * 0-4'
    - cron: '30 1 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: KIS API로 대시보드 생성
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_TYPE: REAL
        run: python generate_report.py
      
      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto: 대시보드 갱신"
          git push
          