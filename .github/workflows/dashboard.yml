name: HOZISTOCK 대시보드 자동 생성

on:
  schedule:
    # UTC 기준 (KST = UTC + 9시간)
    - cron: '37 23 * * 0-4'                 # KST 08:37 (장 시작 전)
    - cron: '7,17,27,37,47,57 0-6 * * 1-5'  # KST 09:07~15:57 (장중 10분 주기)
    - cron: '7 11 * * 1-5'                  # KST 20:07 (일일 정리)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 일봉 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: kis-daily-${{ github.run_id }}
          restore-keys: |
            kis-daily-

      - name: 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: KIS API로 대시보드 생성
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_TYPE: REAL
          TZ: Asia/Seoul
        run: python generate_report.py

      - name: 일봉 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: kis-daily-${{ github.run_id }}

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase --autostash
          git add docs/
          git diff --staged --quiet || git commit -m "Auto: 대시보드 갱신"
          git push
          